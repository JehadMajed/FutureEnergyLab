<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline</title>
<style>
  :root { --brand: #006C6B; --ink: #0F172A; --muted: #64748B; --line: #D9E0E7; --page: #F4F6F8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px; background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 32px 24px; text-align: center;
  }
  .icon {
    width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;
    background: #E6F4F2; display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; }
  button {
    appearance: none; border: 0; border-radius: 10px; background: var(--brand); color: #fff;
    font: inherit; font-weight: 600; padding: 12px 28px; min-width: 160px;
  }
  button:active { background: #005A59; }
  .hint { font-size: 12px; margin: 16px 0 0; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #F59E0B; margin-right: 6px; vertical-align: 1px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#006C6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.6a10 10 0 0 1 14 0"/><path d="M8.5 16.2a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="M3 3l18 18"/>
      </svg>
    </div>
    <h1>No connection</h1>
    <p>The lamp panel's live data needs the internet. The app reconnects by itself as soon as you are back online.</p>
    <button type="button" onclick="retry()">Try again</button>
    <p class="hint"><span class="dot"></span>Waiting for network…</p>
  </div>
<script>
  function retry() {
    if (window.LampPanelApp) window.LampPanelApp.retry();
  }
</script>
</body>
</html>
