# ESPHome configuration for one DAQ node.
# ESP32-S3 <-> TTL-to-RS485 <-> CHINT NB2LE-class smart metering breaker (Modbus RTU).
#
# !! The Modbus register addresses, value types and scales below are PLACEHOLDERS.
# !! Verify every one against your breaker's Modbus manual before use.

substitutions:
  node_name: daq-node-01
  friendly_name: "DAQ Node 01"
  modbus_address: "0x01"      # breaker unit address on the RS485 bus
  uart_tx_pin: "GPIO17"
  uart_rx_pin: "GPIO18"
  de_re_pin: "GPIO16"         # RS485 direction control; remove flow_control_pin if auto-direction
  poll_interval: "1000ms"     # commissioned value: eliminates RS485 bus collisions

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  baud_rate: 0   # free the hardware UART for Modbus

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: mod_uart
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 9600
  stop_bits: 1

modbus:
  id: mod_bus
  uart_id: mod_uart
  flow_control_pin: ${de_re_pin}

modbus_controller:
  - id: breaker
    address: ${modbus_address}
    modbus_id: mod_bus
    update_interval: ${poll_interval}

sensor:
  - platform: modbus_controller
    modbus_controller_id: breaker
    name: "Voltage"
    address: 0x0000          # PLACEHOLDER
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters: [multiply: 0.1] # PLACEHOLDER scale

  - platform: modbus_controller
    modbus_controller_id: breaker
    name: "Current"
    address: 0x0001          # PLACEHOLDER
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    filters: [multiply: 0.001]

  - platform: modbus_controller
    modbus_controller_id: breaker
    name: "Active Power"
    address: 0x0003          # PLACEHOLDER
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "W"
    accuracy_decimals: 1
    filters: [multiply: 0.1]

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: breaker
    name: "Breaker Status"
    address: 0x0010          # PLACEHOLDER
    register_type: holding
    bitmask: 0x1

switch:
  # Single-register write (Modbus Function Code 0x06) drives the internal motorised latch.
  - platform: modbus_controller
    modbus_controller_id: breaker
    name: "Breaker"
    address: 0x0010          # PLACEHOLDER control register
    register_type: holding
    write_lambda: |-
      payload.push_back(0x00);
      payload.push_back(x ? 0x01 : 0x00);
      return true;

# Optional: relay channels for Block B multi-mode routing (via ESP32 GPIO -> relay module)
# switch:
#   - platform: gpio
#     name: "Relay CH1"
#     pin: GPIO4
#   - platform: gpio
#     name: "Relay CH2"
#     pin: GPIO5
